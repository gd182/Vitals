name: Build and Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          xcodebuild -version
          xcrun swift --version
      - name: Non-GUI checks
        run: bash Tests/run-checks.sh
      - name: Universal Release build (unsigned)
        run: |
          xcodebuild -quiet -project Vitals.xcodeproj -scheme Vitals \
            -configuration Release -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/VitalsBuild" \
            ARCHS='arm64 x86_64' ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO build
          binary="$RUNNER_TEMP/VitalsBuild/Build/Products/Release/Vitals.app/Contents/MacOS/Vitals"
          for arch in arm64 x86_64; do
            lipo "$binary" -verify_arch "$arch"
          done
